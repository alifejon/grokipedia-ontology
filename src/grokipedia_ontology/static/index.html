<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grokipedia Ontology Explorer</title>

    <!-- Cytoscape.js -->
    <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
    <!-- Cytoscape layouts -->
    <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
    <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
    <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>

    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --success: #4ecca3;
            --border: #2a2a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            grid-template-rows: 60px 1fr 40px;
            height: 100vh;
            gap: 1px;
            background: var(--border);
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 2rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem;
            padding-left: 2.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .suggestion-item:hover {
            background: var(--bg-tertiary);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .header-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .stat-item span {
            color: var(--success);
            font-weight: 600;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            overflow-y: auto;
            padding: 1rem;
        }

        .sidebar-section {
            margin-bottom: 1.5rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
        }

        .filter-group {
            margin-bottom: 1rem;
        }

        .filter-label {
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            display: block;
        }

        .filter-select, .filter-input {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .concept-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .concept-item {
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: background 0.15s;
        }

        .concept-item:hover {
            background: var(--bg-tertiary);
        }

        .concept-item.selected {
            background: var(--accent);
        }

        .concept-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Graph */
        .graph-container {
            background: var(--bg-primary);
            position: relative;
        }

        #cy {
            width: 100%;
            height: 100%;
        }

        .graph-controls {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .graph-btn {
            padding: 0.5rem 0.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .graph-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
        }

        .layout-selector {
            position: absolute;
            top: 1rem;
            left: 1rem;
        }

        /* Details Panel */
        .details-panel {
            background: var(--bg-secondary);
            padding: 1rem;
            overflow-y: auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .detail-section {
            margin-bottom: 1.25rem;
        }

        .detail-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .detail-value {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .type-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--success);
        }

        .relation-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .relation-item {
            padding: 0.5rem;
            background: var(--bg-primary);
            border-radius: 4px;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }

        .relation-type {
            color: var(--accent);
            font-size: 0.75rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* Footer */
        .footer {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 46, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-tertiary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">Grokipedia Ontology</div>

            <div class="search-container">
                <span class="search-icon">&#128269;</span>
                <input type="text" class="search-input" id="searchInput"
                       placeholder="Search concepts..." autocomplete="off">
                <div class="suggestions" id="suggestions"></div>
            </div>

            <div class="header-stats">
                <div class="stat-item">Concepts: <span id="conceptCount">0</span></div>
                <div class="stat-item">Relations: <span id="relationCount">0</span></div>
            </div>
        </header>

        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Filters</div>

                <div class="filter-group">
                    <label class="filter-label">Concept Type</label>
                    <select class="filter-select" id="typeFilter">
                        <option value="">All Types</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Max Nodes</label>
                    <input type="number" class="filter-input" id="maxNodes"
                           value="100" min="10" max="500">
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Top Concepts</div>
                <div class="concept-list" id="conceptList"></div>
            </div>
        </aside>

        <!-- Graph -->
        <main class="graph-container">
            <div id="cy"></div>

            <div class="layout-selector">
                <select class="filter-select" id="layoutSelect">
                    <option value="fcose">Force-directed (fcose)</option>
                    <option value="circle">Circle</option>
                    <option value="concentric">Concentric</option>
                    <option value="grid">Grid</option>
                    <option value="breadthfirst">Hierarchy</option>
                </select>
            </div>

            <div class="graph-controls">
                <button class="graph-btn" id="fitBtn">Fit</button>
                <button class="graph-btn" id="resetBtn">Reset</button>
                <button class="graph-btn" id="exportBtn">Export PNG</button>
            </div>

            <div class="loading-overlay" id="loading">
                <div class="loading-spinner"></div>
            </div>
        </main>

        <!-- Right Panel -->
        <aside class="details-panel" id="detailsPanel">
            <div class="empty-state" id="emptyState">
                <h3>Select a Concept</h3>
                <p>Click on a node in the graph to see details</p>
            </div>

            <div id="detailsContent" class="hidden">
                <div class="panel-header">
                    <span class="panel-title" id="detailTitle">Concept</span>
                    <button class="close-btn" id="closeDetails">&times;</button>
                </div>

                <div class="detail-section">
                    <div class="detail-label">Type</div>
                    <div class="detail-value">
                        <span class="type-badge" id="detailType"></span>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-label">Description</div>
                    <div class="detail-value" id="detailDescription"></div>
                </div>

                <div class="detail-section">
                    <div class="detail-label">Outgoing Relations</div>
                    <div class="relation-list" id="outRelations"></div>
                </div>

                <div class="detail-section">
                    <div class="detail-label">Incoming Relations</div>
                    <div class="relation-list" id="inRelations"></div>
                </div>
            </div>
        </aside>

        <!-- Footer -->
        <footer class="footer">
            <div>Grokipedia Ontology Explorer v0.1.0</div>
            <div>
                <a href="/api/docs" style="color: var(--accent);">API Docs</a>
            </div>
        </footer>
    </div>

    <script>
        // ====================================================================
        // Configuration
        // ====================================================================

        const TYPE_COLORS = {
            entity: '#4A90D9',
            event: '#E74C3C',
            process: '#27AE60',
            property: '#9B59B6',
            relation: '#F39C12',
            abstract: '#95A5A6',
            person: '#E91E63',
            organization: '#00BCD4',
            location: '#8BC34A',
            time_period: '#FF9800',
            work: '#673AB7',
            technology: '#2196F3'
        };

        const RELATION_COLORS = {
            is_a: '#2C3E50',
            part_of: '#16A085',
            related_to: '#7F8C8D',
            instance_of: '#8E44AD',
            has_property: '#D35400',
            caused_by: '#C0392B',
            results_in: '#E74C3C',
            used_for: '#27AE60',
            located_in: '#3498DB',
            occurs_in: '#9B59B6',
            contradicts: '#E91E63',
            supports: '#4CAF50',
            derived_from: '#FF5722',
            equivalent_to: '#00BCD4',
            see_also: '#607D8B'
        };

        // ====================================================================
        // State
        // ====================================================================

        let cy = null;
        let graphData = { nodes: [], edges: [] };
        let selectedNode = null;

        // ====================================================================
        // API Functions
        // ====================================================================

        async function fetchAPI(endpoint, options = {}) {
            const response = await fetch(`/api${endpoint}`, options);
            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }
            return response.json();
        }

        async function loadStats() {
            try {
                const stats = await fetchAPI('/stats');
                document.getElementById('conceptCount').textContent = stats.total_concepts;
                document.getElementById('relationCount').textContent = stats.total_relations;

                // Populate type filter
                const typeFilter = document.getElementById('typeFilter');
                Object.keys(stats.concepts_by_type).forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = `${type} (${stats.concepts_by_type[type]})`;
                    typeFilter.appendChild(option);
                });

                // Populate top concepts
                const conceptList = document.getElementById('conceptList');
                stats.top_connected.slice(0, 20).forEach(([name, degree]) => {
                    const item = document.createElement('div');
                    item.className = 'concept-item';
                    item.innerHTML = `
                        <span class="concept-dot" style="background: ${TYPE_COLORS.entity}"></span>
                        <span>${name.replace(/_/g, ' ')}</span>
                    `;
                    item.onclick = () => focusNode(name);
                    conceptList.appendChild(item);
                });
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadGraph(center = null) {
            showLoading(true);

            try {
                const maxNodes = document.getElementById('maxNodes').value;
                let endpoint = `/graph?max_nodes=${maxNodes}`;

                if (center) {
                    endpoint += `&center=${encodeURIComponent(center)}&radius=2`;
                }

                graphData = await fetchAPI(endpoint);
                renderGraph();
            } catch (error) {
                console.error('Failed to load graph:', error);
            } finally {
                showLoading(false);
            }
        }

        async function searchConcepts(query) {
            if (!query || query.length < 2) {
                hideSuggestions();
                return;
            }

            try {
                const results = await fetchAPI(`/search?q=${encodeURIComponent(query)}&limit=10`);
                showSuggestions(results.results);
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        async function loadConceptDetails(name) {
            try {
                const concept = await fetchAPI(`/concepts/${encodeURIComponent(name)}`);
                const neighbors = await fetchAPI(`/concepts/${encodeURIComponent(name)}/neighbors`);

                showDetails(concept, neighbors);
            } catch (error) {
                console.error('Failed to load concept:', error);
            }
        }

        // ====================================================================
        // Graph Rendering
        // ====================================================================

        function renderGraph() {
            const elements = [];

            // Add nodes
            graphData.nodes.forEach(node => {
                elements.push({
                    data: {
                        id: node.id,
                        label: node.label,
                        type: node.type,
                        description: node.description,
                        degree: node.degree
                    }
                });
            });

            // Add edges
            graphData.edges.forEach(edge => {
                elements.push({
                    data: {
                        id: `${edge.source}-${edge.target}`,
                        source: edge.source,
                        target: edge.target,
                        type: edge.type,
                        confidence: edge.confidence
                    }
                });
            });

            // Initialize or update Cytoscape
            if (cy) {
                cy.destroy();
            }

            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(label)',
                            'background-color': node => TYPE_COLORS[node.data('type')] || '#95A5A6',
                            'color': '#eaeaea',
                            'text-valign': 'bottom',
                            'text-margin-y': 5,
                            'font-size': 10,
                            'width': node => Math.max(20, Math.min(50, 10 + node.data('degree') * 2)),
                            'height': node => Math.max(20, Math.min(50, 10 + node.data('degree') * 2)),
                            'border-width': 2,
                            'border-color': '#2a2a4a'
                        }
                    },
                    {
                        selector: 'node:selected',
                        style: {
                            'border-width': 4,
                            'border-color': '#e94560',
                            'background-color': '#ff6b6b'
                        }
                    },
                    {
                        selector: 'node.highlighted',
                        style: {
                            'border-width': 3,
                            'border-color': '#4ecca3'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': edge => 1 + edge.data('confidence') * 2,
                            'line-color': edge => RELATION_COLORS[edge.data('type')] || '#7F8C8D',
                            'target-arrow-color': edge => RELATION_COLORS[edge.data('type')] || '#7F8C8D',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'opacity': 0.7
                        }
                    },
                    {
                        selector: 'edge.highlighted',
                        style: {
                            'width': 4,
                            'opacity': 1,
                            'z-index': 100
                        }
                    },
                    {
                        selector: '.faded',
                        style: {
                            'opacity': 0.15
                        }
                    }
                ],
                layout: {
                    name: 'fcose',
                    animate: true,
                    randomize: true,
                    nodeRepulsion: 8000,
                    idealEdgeLength: 100
                },
                wheelSensitivity: 0.2
            });

            // Event handlers
            cy.on('tap', 'node', event => {
                const node = event.target;
                selectNode(node);
            });

            cy.on('tap', event => {
                if (event.target === cy) {
                    clearSelection();
                }
            });

            cy.on('mouseover', 'node', event => {
                const node = event.target;
                highlightConnected(node);
            });

            cy.on('mouseout', 'node', () => {
                clearHighlight();
            });
        }

        function selectNode(node) {
            selectedNode = node;
            cy.nodes().unselect();
            node.select();
            loadConceptDetails(node.id());
        }

        function clearSelection() {
            selectedNode = null;
            cy.nodes().unselect();
            hideDetails();
        }

        function highlightConnected(node) {
            const connected = node.closedNeighborhood();
            cy.elements().addClass('faded');
            connected.removeClass('faded');
            connected.edges().addClass('highlighted');
        }

        function clearHighlight() {
            cy.elements().removeClass('faded');
            cy.edges().removeClass('highlighted');
        }

        function focusNode(name) {
            const node = cy.getElementById(name);
            if (node.length) {
                cy.animate({
                    center: { eles: node },
                    zoom: 1.5
                }, { duration: 500 });
                selectNode(node);
            } else {
                // Node not in current view, reload with it as center
                loadGraph(name);
            }
        }

        function runLayout(name) {
            const layouts = {
                fcose: {
                    name: 'fcose',
                    animate: true,
                    randomize: false,
                    nodeRepulsion: 8000
                },
                circle: { name: 'circle', animate: true },
                concentric: {
                    name: 'concentric',
                    animate: true,
                    concentric: node => node.degree()
                },
                grid: { name: 'grid', animate: true },
                breadthfirst: {
                    name: 'breadthfirst',
                    animate: true,
                    directed: true
                }
            };

            cy.layout(layouts[name] || layouts.fcose).run();
        }

        // ====================================================================
        // UI Functions
        // ====================================================================

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        function showSuggestions(results) {
            const container = document.getElementById('suggestions');
            container.innerHTML = '';

            if (results.length === 0) {
                hideSuggestions();
                return;
            }

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.innerHTML = `
                    <div><strong>${result.label}</strong></div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary)">
                        ${result.type} - Score: ${result.score.toFixed(2)}
                    </div>
                `;
                item.onclick = () => {
                    focusNode(result.name);
                    hideSuggestions();
                    document.getElementById('searchInput').value = result.label;
                };
                container.appendChild(item);
            });

            container.classList.add('active');
        }

        function hideSuggestions() {
            document.getElementById('suggestions').classList.remove('active');
        }

        function showDetails(concept, neighbors) {
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('detailsContent').classList.remove('hidden');

            document.getElementById('detailTitle').textContent = concept.label;
            document.getElementById('detailType').textContent = concept.concept_type;
            document.getElementById('detailDescription').textContent =
                concept.description || 'No description available';

            // Get relations from graph
            const outRelations = document.getElementById('outRelations');
            const inRelations = document.getElementById('inRelations');

            outRelations.innerHTML = '';
            inRelations.innerHTML = '';

            if (cy && selectedNode) {
                // Outgoing edges
                selectedNode.outgoers('edge').forEach(edge => {
                    const item = document.createElement('div');
                    item.className = 'relation-item';
                    item.innerHTML = `
                        <span class="relation-type">${edge.data('type')}</span>
                        <div>${edge.target().data('label')}</div>
                    `;
                    item.onclick = () => focusNode(edge.target().id());
                    outRelations.appendChild(item);
                });

                // Incoming edges
                selectedNode.incomers('edge').forEach(edge => {
                    const item = document.createElement('div');
                    item.className = 'relation-item';
                    item.innerHTML = `
                        <span class="relation-type">${edge.data('type')}</span>
                        <div>${edge.source().data('label')}</div>
                    `;
                    item.onclick = () => focusNode(edge.source().id());
                    inRelations.appendChild(item);
                });
            }

            if (outRelations.children.length === 0) {
                outRelations.innerHTML = '<div style="color: var(--text-secondary)">None</div>';
            }
            if (inRelations.children.length === 0) {
                inRelations.innerHTML = '<div style="color: var(--text-secondary)">None</div>';
            }
        }

        function hideDetails() {
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('detailsContent').classList.add('hidden');
        }

        // ====================================================================
        // Event Listeners
        // ====================================================================

        document.addEventListener('DOMContentLoaded', async () => {
            await loadStats();
            await loadGraph();

            // Search
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', e => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => searchConcepts(e.target.value), 300);
            });

            document.getElementById('searchInput').addEventListener('blur', () => {
                setTimeout(hideSuggestions, 200);
            });

            // Layout selector
            document.getElementById('layoutSelect').addEventListener('change', e => {
                runLayout(e.target.value);
            });

            // Type filter
            document.getElementById('typeFilter').addEventListener('change', () => {
                loadGraph();
            });

            // Max nodes
            document.getElementById('maxNodes').addEventListener('change', () => {
                loadGraph();
            });

            // Control buttons
            document.getElementById('fitBtn').addEventListener('click', () => {
                cy.fit();
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                loadGraph();
            });

            document.getElementById('exportBtn').addEventListener('click', () => {
                const png = cy.png({ scale: 2, bg: '#1a1a2e' });
                const link = document.createElement('a');
                link.href = png;
                link.download = 'knowledge-graph.png';
                link.click();
            });

            document.getElementById('closeDetails').addEventListener('click', () => {
                clearSelection();
            });
        });
    </script>
</body>
</html>
