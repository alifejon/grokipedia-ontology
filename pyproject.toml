[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grokipedia-ontology"
version = "0.1.0"
description = "A knowledge graph and ontology framework using Grokipedia as a data source"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grokipedia Ontology Project" }
]
keywords = [
    "ontology",
    "knowledge-graph",
    "grokipedia",
    "semantic-web",
    "rdf",
    "owl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "rdflib>=7.0.0",
    "owlready2>=0.46",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.5.0",
    "networkx>=3.2.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
visualization = [
    "pyvis>=0.3.2",
    "matplotlib>=3.8.0",
]

[project.scripts]
grokipedia-ontology = "grokipedia_ontology.cli:app"

[project.urls]
Homepage = "https://github.com/grokipedia-ontology/grokipedia-ontology"
Documentation = "https://github.com/grokipedia-ontology/grokipedia-ontology#readme"
Repository = "https://github.com/grokipedia-ontology/grokipedia-ontology"

[tool.hatch.build.targets.wheel]
packages = ["src/grokipedia_ontology"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
